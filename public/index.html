<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Giriş</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/login.css">
  <script src="/login.js" defer></script>
</head>
<body>
  <main class="login-layout">
    <div class="login-story">
      <div class="wordmark wordmark-light"><span class="brand-symbol" aria-hidden="true">◇</span><span>ÖZEL ALAN</span></div>
      <div class="story-art" aria-hidden="true"><div class="story-orbit orbit-one"></div><div class="story-orbit orbit-two"></div><div class="story-center">◇</div></div>
      <div class="story-copy"><span class="micro-label">YETKİLİ ERİŞİM</span><h1>Hoş geldin.</h1><p>Devam etmek için giriş yap.</p></div>
      <div class="story-foot"><span class="foot-rule"></span><span>Özel alan</span></div>
    </div>
    <div class="login-main">
      <div class="login-form-wrap">
        <div class="login-index">01 <span></span> GİRİŞ</div>
        <h2>Giriş yap.</h2>
        <p class="login-lead">Bilgilerini girerek devam et.</p>
        <form id="login-form" autocomplete="on">
          <label for="username">Kullanıcı adı veya telefon</label>
          <input id="username" name="username" autocomplete="username" required spellcheck="false" placeholder="Kullanıcı adın">
          <label for="password">Şifre</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required placeholder="Şifren">
          <p class="form-error" id="login-error" role="alert" hidden></p>
          <button class="button button-primary login-submit" id="login-submit" type="submit"><span>Devam et</span><span class="button-arrow" aria-hidden="true">↗</span></button>
        </form>
      </div>
      <div class="login-footer">Yalnızca yetkili kullanıcılar</div>
    </div>
  </main>
</body>
</html>
